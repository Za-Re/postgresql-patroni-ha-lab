# Static inventory. IPs are the private-network addresses from the Vagrantfile.

[postgres]
pg-01 ansible_host=192.168.56.11
pg-02 ansible_host=192.168.56.12
pg-03 ansible_host=192.168.56.13

[etcd]
pg-01
pg-02
pg-03

[loadbalancer]
lb-01 ansible_host=192.168.56.20

[all:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=../vagrant/.vagrant/machines/{{ inventory_hostname }}/virtualbox/private_key
ansible_python_interpreter=/usr/bin/python3
