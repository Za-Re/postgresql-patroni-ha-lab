- name: create etcd system group
  group:
    name: etcd
    system: true

- name: create etcd system user # service account
  user:
    name: etcd
    group: etcd
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: /var/lib/etcd

- name: create etcd data directory
  file:
    path: /var/lib/etcd
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"

- name: download etcd release
  get_url:
    url: "https://github.com/etcd-io/etcd/releases/download/{{ etcd_version }}/etcd-{{ etcd_version }}-linux-amd64.tar.gz"
    dest: "/tmp/etcd-{{ etcd_version }}-linux-amd64.tar.gz"
    mode: "0644"

- name: extract etcd release
  unarchive:
    src: "/tmp/etcd-{{ etcd_version }}-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/etcd-{{ etcd_version }}-linux-amd64/etcd"

- name: install etcd and etcdctl binaries
  copy:
    src: "/tmp/etcd-{{ etcd_version }}-linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
    remote_src: true
  loop:
    - etcd
    - etcdctl

- name: install etcd systemd unit
  template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    mode: "0644"
  notify: restart etcd

- name: enable and start etcd
  systemd:
    name: etcd
    daemon_reload: true
    state: started
    enabled: true
