- name: install haproxy
  apt:
    name: haproxy
    state: present
    update_cache: true

- name: install haproxy config
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: "0644"
  notify: restart haproxy

- name: enable and start haproxy
  systemd:
    name: haproxy
    daemon_reload: true
    state: started
    enabled: true
